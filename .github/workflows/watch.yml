# Polls the Islamweb fatwa page and notifies a human when the form opens.
# It NEVER submits the form - see the header of watch.py.
name: watch

on:
  schedule:
    # 40 minutes past the hour, for the hours whose opening we care about.
    #
    # A run starting at HH:40 UTC is waiting for the (HH+1):00 opening.
    # Makkah is UTC+3 with no DST, so 06:40-19:40 UTC covers the 10:00
    # through 23:00 Makkah openings and stays quiet from midnight to 10:00
    # Makkah - 14 runs a day instead of 24.
    #
    # `schedule.active_hours` in config.yaml is what ACTUALLY enforces this;
    # this cron just avoids starting runs that would exit immediately. If you
    # change one, change the other.
    #
    # WHY :40 AND NOT :52. GitHub's scheduler is best-effort and routinely
    # fires late - occasionally by more than fifteen minutes. The window being
    # watched is only :00 to :15, so a :52 cron that ran twenty minutes late
    # would start after the window had already closed and poll nothing at all,
    # silently. Firing at :40 buys twenty minutes of tolerance, and costs the
    # site nothing: watch.py sleeps until `window_start_lead_seconds` before
    # the hour rather than polling through the lead time. Keep this at or
    # above `schedule.lookahead_from_minute` in config.yaml - tests/test_config.py
    # fails the build if the two drift apart.
    - cron: '40 6-19 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'With mode=dump, a URL to probe. With mode=check-ref, a fatwa number or link.'
        required: false
        type: string
      mode:
        description: 'What to run'
        required: true
        default: 'run'
        type: choice
        options: [run, once, check-robots, test-alert, dump, report, show-config,
                  status, pause, resume, check-answers, commands, check-ref]

permissions:
  contents: write

concurrency:
  group: islamweb-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # A run fired at :40 sleeps to :59 and may poll to :15, so the job can
    # legitimately live for ~35 minutes. watch.py enforces its own hard stop
    # (MAX_RUN_SECONDS, derived from config.yaml) below this ceiling; this is
    # only the backstop for a process that hangs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show the effective configuration
        run: python watch.py --show-config

      - name: Check robots.txt
        # Informational: watch.py re-checks this itself and refuses to poll
        # if the page is disallowed. Never fails the job.
        run: python watch.py --check-robots || true

      - name: Run the watcher
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${{ inputs.mode || 'run' }}" in
            once)         python watch.py --once ;;
            check-robots) python watch.py --check-robots ;;
            test-alert)   python watch.py --test-alert ;;
            dump)         python watch.py --dump ${{ inputs.url && format('--url {0}', inputs.url) || '' }} ;;
            report)       python watch.py --report ;;
            show-config)  python watch.py --show-config ;;
            status)       python watch.py --status ;;
            pause)        python watch.py --pause ;;
            resume)       python watch.py --resume ;;
            check-answers) python watch.py --check-answers --force ;;
            commands)     python watch.py --commands ;;
            check-ref)    python watch.py --check-ref "${{ inputs.url }}" ;;
            *)            python watch.py --run ;;
          esac

      - name: Refresh the observation report
        if: always()
        run: python watch.py --report --write >/dev/null || true

      - name: Commit observations
        if: always()
        run: |
          set -u
          git config user.name  "islamweb-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Add each path separately: `git add a b` with a missing b
          # stages neither, which silently swallowed the log.
          git add log/observations.csv || true
          [ -f log/REPORT.md ] && git add log/REPORT.md || true
          [ -f state.json ] && git add state.json || true
          if git diff --cached --quiet; then
            echo "No new observations to commit."
            exit 0
          fi
          git commit -m "log: observations $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            sleep $((2 ** attempt))
          done
          echo "::warning::Could not push observations after 4 attempts."
